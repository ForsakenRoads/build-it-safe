<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <rect width="800" height="360" fill="#fff"/>
  <!-- outer: sandbox -->
  <rect x="20" y="20" width="560" height="320" rx="16" fill="#eef3f8" stroke="#12324f" stroke-width="3"/>
  <text x="40" y="52" font-size="18" font-weight="700" fill="#12324f">3. Sandbox or separate machine</text>
  <text x="40" y="75" font-size="14" fill="#333">enforced by the operating system: what the agent can reach</text>
  <!-- middle: permissions/hooks -->
  <rect x="50" y="95" width="500" height="220" rx="14" fill="#fbf4ef" stroke="#9a3b1b" stroke-width="3"/>
  <text x="70" y="126" font-size="18" font-weight="700" fill="#8a3417">2. Permissions and hooks</text>
  <text x="70" y="149" font-size="14" fill="#333">enforced by the agent's software: what it may do</text>
  <!-- inner: instructions -->
  <rect x="80" y="170" width="440" height="120" rx="12" fill="#f2f7f1" stroke="#3b6e3b" stroke-width="3"/>
  <text x="100" y="201" font-size="18" font-weight="700" fill="#2f5a2f">1. Instructions (CLAUDE.md, AGENTS.md)</text>
  <text x="100" y="224" font-size="14" fill="#333">read by the AI: what it tries to do</text>
  <circle cx="300" cy="262" r="20" fill="#12324f"/>
  <text x="330" y="268" font-size="15" font-weight="700" fill="#12324f">the agent</text>
  <!-- legend -->
  <g font-size="15">
    <text x="600" y="75" font-weight="700" fill="#12324f">Strongest</text>
    <text x="600" y="98" fill="#333">a wall it cannot</text>
    <text x="600" y="118" fill="#333">get past</text>
    <text x="600" y="160" font-weight="700" fill="#8a3417">Strong</text>
    <text x="600" y="183" fill="#333">a lock it cannot</text>
    <text x="600" y="203" fill="#333">argue with</text>
    <text x="600" y="245" font-weight="700" fill="#2f5a2f">Helpful</text>
    <text x="600" y="268" fill="#333">advice it can ignore,</text>
    <text x="600" y="288" fill="#333">forget, or be tricked</text>
    <text x="600" y="308" fill="#333">out of</text>
  </g>
</svg>
