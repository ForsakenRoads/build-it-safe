<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <rect width="800" height="330" fill="#fff"/>
  <!-- left: master key -->
  <text x="190" y="35" font-size="19" font-weight="700" text-anchor="middle" fill="#8a3417">One master key</text>
  <rect x="140" y="55" width="100" height="44" rx="22" fill="#fbf4ef" stroke="#9a3b1b" stroke-width="2.5"/>
  <text x="190" y="83" font-size="15" text-anchor="middle" fill="#8a3417">sk_… (all)</text>
  <g font-size="14" text-anchor="middle" fill="#1a1a1a">
    <rect x="25" y="160" width="100" height="44" rx="6" fill="#fff" stroke="#9a3b1b" stroke-width="2"/><text x="75" y="187">payments</text>
    <rect x="140" y="160" width="100" height="44" rx="6" fill="#fff" stroke="#9a3b1b" stroke-width="2"/><text x="190" y="187">refunds</text>
    <rect x="255" y="160" width="100" height="44" rx="6" fill="#fff" stroke="#9a3b1b" stroke-width="2"/><text x="305" y="187">payouts</text>
    <rect x="80" y="220" width="100" height="44" rx="6" fill="#fff" stroke="#9a3b1b" stroke-width="2"/><text x="130" y="247">customers</text>
    <rect x="200" y="220" width="100" height="44" rx="6" fill="#fff" stroke="#9a3b1b" stroke-width="2"/><text x="250" y="247">settings</text>
  </g>
  <g stroke="#9a3b1b" stroke-width="2"><path d="M190 99 L75 160"/><path d="M190 99 L190 160"/><path d="M190 99 L305 160"/><path d="M190 99 L130 220"/><path d="M190 99 L250 220"/></g>
  <text x="190" y="300" font-size="15" text-anchor="middle" fill="#333">One leak opens everything.</text>
  <line x1="400" y1="30" x2="400" y2="300" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- right: scoped keys -->
  <text x="610" y="35" font-size="19" font-weight="700" text-anchor="middle" fill="#2f5a2f">Scoped keys</text>
  <g font-size="14" text-anchor="middle">
    <rect x="440" y="70" width="140" height="40" rx="20" fill="#f2f7f1" stroke="#3b6e3b" stroke-width="2.5"/><text x="510" y="95" fill="#2f5a2f">rk_ invoices only</text>
    <rect x="640" y="70" width="120" height="40" rx="6" fill="#fff" stroke="#3b6e3b" stroke-width="2"/><text x="700" y="95" fill="#1a1a1a">invoices</text>
    <rect x="440" y="140" width="140" height="40" rx="20" fill="#f2f7f1" stroke="#3b6e3b" stroke-width="2.5"/><text x="510" y="165" fill="#2f5a2f">rk_ read disputes</text>
    <rect x="640" y="140" width="120" height="40" rx="6" fill="#fff" stroke="#3b6e3b" stroke-width="2"/><text x="700" y="165" fill="#1a1a1a">disputes (read)</text>
    <rect x="440" y="210" width="140" height="40" rx="20" fill="#f2f7f1" stroke="#3b6e3b" stroke-width="2.5"/><text x="510" y="235" fill="#2f5a2f">backup: no delete</text>
    <rect x="640" y="210" width="120" height="40" rx="6" fill="#fff" stroke="#3b6e3b" stroke-width="2"/><text x="700" y="235" fill="#1a1a1a">one bucket</text>
  </g>
  <g stroke="#3b6e3b" stroke-width="2.5"><path d="M580 90 L640 90"/><path d="M580 160 L640 160"/><path d="M580 230 L640 230"/></g>
  <text x="600" y="300" font-size="15" text-anchor="middle" fill="#333">One leak opens one small door.</text>
</svg>
